<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UCS Academy | Attendance</title>
<style>
:root {
  --bg: #f4f6fa; --card: #ffffff; --text: #1d2433; --muted: #667085;
  --line: #e2e6ee; --accent: #0f766e; --input: #ffffff;
  --present: #16a34a; --late: #d97706; --absent: #dc2626;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1420; --card: #171f2e; --text: #e6ebf5; --muted: #9aa6bb;
    --line: #2a3548; --accent: #2dd4bf; --input: #101827;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.4;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
.wrap { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
.logo {
  width: 48px; height: 48px; border-radius: 12px; background: var(--accent); color: #fff;
  display: grid; place-items: center; font-weight: 800; font-size: 15px; letter-spacing: .5px; flex-shrink: 0;
}
h1 { font-size: 1.4rem; margin: 0; }
header p { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: 2fr 1fr; gap: 12px; }
label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 4px; }
input[type="text"], input[type="date"] {
  width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--input); color: var(--text); font: inherit;
}
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
button {
  font: inherit; cursor: pointer; border-radius: 10px; padding: 9px 14px;
  border: 1px solid var(--line); background: var(--card); color: var(--text);
}
button:hover { filter: brightness(.97); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.stat { text-align: center; padding: 12px 6px; border-radius: 12px; border: 1px solid var(--line); }
.stat b { display: block; font-size: 1.4rem; }
.stat span { font-size: .75rem; color: var(--muted); }
.s-present b { color: var(--present); }
.s-late b { color: var(--late); }
.s-absent b { color: var(--absent); }
.list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.list-head h2 { font-size: 1rem; margin: 0; }
.search { max-width: 220px; }
.row {
  display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center;
  padding: 10px 6px; border-bottom: 1px solid var(--line);
}
.row:last-child { border-bottom: none; }
.info strong { display: block; }
.info span { font-size: .8rem; color: var(--muted); }
.status { display: flex; gap: 6px; }
.pill { padding: 7px 12px; font-size: .85rem; min-width: 74px; }
.pill.present.on { background: var(--present); border-color: var(--present); color: #fff; }
.pill.late.on { background: var(--late); border-color: var(--late); color: #fff; }
.pill.absent.on { background: var(--absent); border-color: var(--absent); color: #fff; }
.remove { padding: 6px 10px; color: var(--muted); }
.remove:hover { color: var(--absent); }
.empty { text-align: center; color: var(--muted); padding: 24px 0; }
.add-form { display: grid; grid-template-columns: 2fr 1fr auto; gap: 10px; align-items: end; }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
  background: #111827; color: #fff; padding: 10px 16px; border-radius: 10px;
  font-size: .9rem; opacity: 0; transition: opacity .2s; pointer-events: none;
}
.toast.show { opacity: 1; }
@media (max-width: 640px) {
  .grid, .add-form { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .row { grid-template-columns: 1fr; gap: 8px; }
  .status { justify-content: flex-start; }
  .search { max-width: none; width: 100%; margin-top: 8px; }
  .list-head { flex-direction: column; align-items: stretch; gap: 4px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">UCS</div>
    <div>
      <h1>Student Attendance</h1>
      <p>UCS Academy &middot; Cyber Security Instructor Portal</p>
    </div>
  </header>

  <section class="card">
    <div class="grid">
      <div>
        <label for="course">Course / Session</label>
        <input type="text" id="course" value="Cyber Security Fundamentals">
      </div>
      <div>
        <label for="date">Date</label>
        <input type="date" id="date">
      </div>
    </div>
    <div class="actions">
      <button class="btn-primary" id="saveBtn">Save</button>
      <button id="allPresentBtn">Mark all present</button>
      <button id="clearBtn">Clear marks</button>
      <button id="exportBtn">Export CSV</button>
    </div>
  </section>

  <section class="card">
    <div class="stats">
      <div class="stat"><b id="totalN">0</b><span>Total</span></div>
      <div class="stat s-present"><b id="presentN">0</b><span>Present</span></div>
      <div class="stat s-late"><b id="lateN">0</b><span>Late</span></div>
      <div class="stat s-absent"><b id="absentN">0</b><span>Absent</span></div>
      <div class="stat"><b id="rateN">0%</b><span>Attendance</span></div>
    </div>
  </section>

  <section class="card">
    <div class="list-head">
      <h2>Students</h2>
      <input type="text" id="search" class="search" placeholder="Search by name or ID">
    </div>
    <div id="list"></div>
  </section>

  <section class="card">
    <h2 style="font-size:1rem;margin:0 0 12px;">Add student</h2>
    <form class="add-form" id="addForm" autocomplete="off">
      <div>
        <label for="newName">Full name</label>
        <input type="text" id="newName" required>
      </div>
      <div>
        <label for="newRoll">Student ID</label>
        <input type="text" id="newRoll">
      </div>
      <button type="submit" class="btn-primary">Add</button>
    </form>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var KEY = "ucs-attendance-v1";
  var DEFAULT_STUDENTS = [
    { id: "s1", name: "Student One", roll: "UCS-001" },
    { id: "s2", name: "Student Two", roll: "UCS-002" },
    { id: "s3", name: "Student Three", roll: "UCS-003" },
    { id: "s4", name: "Student Four", roll: "UCS-004" },
    { id: "s5", name: "Student Five", roll: "UCS-005" }
  ];

  var state = load();
  var $ = function (id) { return document.getElementById(id); };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.students)) return parsed;
      }
    } catch (e) {}
    return { students: DEFAULT_STUDENTS.slice(), records: {} };
  }

  function save(showToast) {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      if (showToast) toast("Attendance saved");
    } catch (e) {
      toast("Could not save in this browser");
    }
  }

  function todayISO() {
    var d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  function sessionKey() {
    return $("course").value.trim() + "|" + $("date").value;
  }

  function session() {
    var k = sessionKey();
    if (!state.records[k]) state.records[k] = {};
    return state.records[k];
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function render() {
    var rec = session();
    var q = $("search").value.trim().toLowerCase();
    var list = $("list");
    var counts = { present: 0, late: 0, absent: 0 };

    state.students.forEach(function (s) {
      if (counts[rec[s.id]] !== undefined) counts[rec[s.id]]++;
    });

    var visible = state.students.filter(function (s) {
      return !q || s.name.toLowerCase().indexOf(q) !== -1 || (s.roll || "").toLowerCase().indexOf(q) !== -1;
    });

    if (visible.length === 0) {
      list.innerHTML = '<div class="empty">' + (state.students.length ? "No students match your search." : "No students yet. Add one below.") + "</div>";
    } else {
      list.innerHTML = visible.map(function (s) {
        var st = rec[s.id];
        var pills = ["present", "late", "absent"].map(function (x) {
          var label = x.charAt(0).toUpperCase() + x.slice(1);
          return '<button class="pill ' + x + (st === x ? " on" : "") + '" data-id="' + s.id + '" data-status="' + x + '">' + label + "</button>";
        }).join("");
        return '<div class="row">' +
          '<div class="info"><strong>' + esc(s.name) + "</strong><span>" + esc(s.roll || "No ID") + "</span></div>" +
          '<div class="status">' + pills + "</div>" +
          '<button class="remove" data-remove="' + s.id + '" title="Remove student">&#10005;</button>' +
          "</div>";
      }).join("");
    }

    var total = state.students.length;
    var attended = counts.present + counts.late;
    $("totalN").textContent = total;
    $("presentN").textContent = counts.present;
    $("lateN").textContent = counts.late;
    $("absentN").textContent = counts.absent;
    $("rateN").textContent = total ? Math.round((attended / total) * 100) + "%" : "0%";
  }

  $("list").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var rec = session();
    if (btn.dataset.status) {
      var id = btn.dataset.id, status = btn.dataset.status;
      if (rec[id] === status) delete rec[id];
      else rec[id] = status;
      save(false);
      render();
    } else if (btn.dataset.remove) {
      var sid = btn.dataset.remove;
      var student = state.students.find(function (s) { return s.id === sid; });
      if (!student || !confirm("Remove " + student.name + " from the roster?")) return;
      state.students = state.students.filter(function (s) { return s.id !== sid; });
      Object.keys(state.records).forEach(function (k) { delete state.records[k][sid]; });
      save(false);
      render();
    }
  });

  $("allPresentBtn").addEventListener("click", function () {
    var rec = session();
    state.students.forEach(function (s) { rec[s.id] = "present"; });
    save(false);
    render();
    toast("All students marked present");
  });

  $("clearBtn").addEventListener("click", function () {
    if (!confirm("Clear all marks for this course and date?")) return;
    state.records[sessionKey()] = {};
    save(false);
    render();
    toast("Marks cleared");
  });

  $("saveBtn").addEventListener("click", function () { save(true); });

  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("newName").value.trim();
    var roll = $("newRoll").value.trim();
    if (!name) return;
    state.students.push({
      id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: name,
      roll: roll
    });
    $("newName").value = "";
    $("newRoll").value = "";
    save(false);
    render();
    toast("Student added");
  });

  $("exportBtn").addEventListener("click", function () {
    var rec = session();
    var course = $("course").value.trim();
    var date = $("date").value;
    var rows = [["Name", "Student ID", "Status", "Course", "Date"]];
    state.students.forEach(function (s) {
      rows.push([s.name, s.roll || "", rec[s.id] || "Not marked", course, date]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "attendance-" + date + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  $("search").addEventListener("input", render);
  $("course").addEventListener("change", render);
  $("date").addEventListener("change", render);

  $("date").value = todayISO();
  render();
})();
</script>
</body>
</html>
