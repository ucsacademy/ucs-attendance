<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UCS | Cybersecurity Attendance Command Center</title>
<style>

:root{
  --navy:#101b35;--navy2:#192847;--blue:#5268f5;--blue-soft:#edf0ff;
  --bg:#f5f7fc;--card:#fff;--text:#172033;--muted:#778198;--line:#e4e9f2;
  --input:#fff;--present:#159b72;--late:#d99020;--absent:#dc5261;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
aside{background:linear-gradient(165deg,#111c36 0%,#18294c 70%,#243b67 100%);color:#eaf0ff;padding:26px 18px;display:flex;flex-direction:column;gap:30px;position:relative;overflow:hidden}
aside:after{content:"";position:absolute;width:220px;height:220px;border:1px solid #ffffff12;border-radius:50%;right:-130px;top:42%;box-shadow:0 0 0 28px #ffffff08,0 0 0 58px #ffffff05;pointer-events:none}
.brand-card{background:#fff;border:1px solid #ffffff30;border-radius:16px;padding:13px;display:flex;justify-content:center;box-shadow:0 12px 30px #0002}
.brand-card img{width:100%;max-width:205px;height:auto;display:block}
.nav-title{font-size:.68rem;letter-spacing:1.7px;text-transform:uppercase;color:#98a8c8;margin-bottom:10px;font-weight:750}
.course-pill{background:#ffffff0b;border:1px solid #ffffff1b;border-radius:14px;padding:15px}
.course-pill strong{display:block;font-size:.94rem;color:#fff;line-height:1.45}
.course-pill span{display:block;font-size:.78rem;color:#a8b7d5;margin-top:7px}
.side-stats{display:grid;gap:9px}
.side-stat{display:flex;justify-content:space-between;align-items:center;background:#ffffff0b;border:1px solid #ffffff0c;border-radius:12px;padding:11px 12px;font-size:.86rem;color:#cbd5e8}
.side-stat b{font-size:1.15rem;color:#fff;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:8px}
main{padding:34px clamp(18px,3.4vw,48px) 64px;max-width:1600px;width:100%;margin:0 auto}
.topbar{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-end;margin-bottom:26px}
h1{font-size:clamp(1.65rem,2.3vw,2.15rem);letter-spacing:-.045em;margin:0;font-weight:780;color:#121c32}
.topbar p{margin:7px 0 0;color:var(--muted);font-size:.92rem}
.topbar:before{content:"UCS  /  ACADEMIC OPERATIONS";display:block;position:absolute;top:18px;font-size:.65rem;letter-spacing:1.8px;font-weight:800;color:#5268f5}
.topbar{padding-top:13px}
.filters{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:14px;margin-bottom:18px}
label{display:block;font-size:.76rem;color:#69758e;margin-bottom:7px;font-weight:700;letter-spacing:.02em}
input[type=text],input[type=date]{width:100%;padding:12px 14px;border-radius:11px;border:1px solid #dfe5f0;background:var(--input);color:var(--text);font:inherit;transition:border .15s,box-shadow .15s}
input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px #5268f51b}
.card{background:var(--card);border:1px solid #e6eaf2;border-radius:18px;padding:21px;margin-bottom:18px;box-shadow:0 8px 26px #1d2b4a06}
.toolbar{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:22px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:10px;padding:10px 14px;border:1px solid #dfe5f0;background:#fff;color:#34405a;font-weight:650;font-size:.84rem;transition:transform .15s,border-color .15s,background .15s;white-space:nowrap}
button:hover{border-color:var(--blue);transform:translateY(-1px)}
.btn-primary{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 5px 12px #5268f52b}
.btn-primary:hover{filter:brightness(1.06);border-color:var(--blue)}
#clearBtn{color:#bd4251}
#exportBtn,#exportRangeBtn{background:#f6f8ff}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
.stat{position:relative;background:var(--card);border:1px solid #e6eaf2;border-radius:16px;padding:18px 19px;box-shadow:0 8px 26px #1d2b4a06;overflow:hidden}
.stat:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:#8793aa}
.stat.present:before{background:var(--present)}.stat.late:before{background:var(--late)}.stat.absent:before{background:var(--absent)}
.stat span{font-size:.78rem;color:var(--muted);font-weight:650}
.stat b{display:block;font-size:2rem;line-height:1.2;letter-spacing:-.04em;margin-top:8px;color:#18233a;font-variant-numeric:tabular-nums}
.stat.present b{color:var(--present)}.stat.late b{color:var(--late)}.stat.absent b{color:var(--absent)}
.progress{height:5px;background:#f2dfe2;border-radius:99px;overflow:hidden;margin-top:13px}
.progress div{height:100%;background:var(--absent);width:0;transition:width .3s}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:15px;border-bottom:1px solid var(--line)}
.list-head h2{font-size:1rem;margin:0;font-weight:750;letter-spacing:-.02em}
#rateText{font-size:.78rem;color:var(--present);background:#e9f8f1;padding:5px 9px;border-radius:99px;margin-left:5px;white-space:nowrap}
.search{width:260px}
.row{display:grid;grid-template-columns:42px minmax(120px,1fr) auto 30px;gap:13px;align-items:center;padding:13px 4px;border-bottom:1px solid #edf0f6}
.row:last-child{border-bottom:none}
.avatar{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#eef0ff,#e1e7ff);color:#5268f5;display:grid;place-items:center;font-weight:800;font-size:.82rem}
.info strong{display:block;font-weight:700;font-size:.9rem;color:#202b42}
.info span{font-size:.76rem;color:var(--muted)}
.status{display:flex;gap:6px}
.pill{padding:7px 11px;font-size:.76rem;min-width:70px;border-radius:9px}
.pill.present.on{background:#159b72;border-color:#159b72;color:#fff}.pill.late.on{background:#d99020;border-color:#d99020;color:#fff}.pill.absent.on{background:#dc5261;border-color:#dc5261;color:#fff}
.remove{padding:6px;color:#a2aabc;border:0;background:transparent;font-size:1rem}
.remove:hover{color:var(--absent);background:#fff0f1}
.empty{text-align:center;color:var(--muted);padding:32px 0}
.add-form{display:grid;grid-template-columns:minmax(0,2fr) minmax(130px,1fr) auto;gap:12px;align-items:end}
.card h2{font-size:1rem!important;font-weight:750!important;letter-spacing:-.02em!important}
.toast{position:fixed;right:24px;bottom:24px;background:#14213d;color:#fff;padding:13px 18px;border-radius:12px;font-size:.88rem;opacity:0;transform:translateY(8px);transition:all .2s;pointer-events:none;box-shadow:0 14px 35px #0002;z-index:20}
.toast.show{opacity:1;transform:translateY(0)}
@media(max-width:1000px){.layout{grid-template-columns:1fr}aside{display:grid;grid-template-columns:minmax(150px,220px) 1fr 1.1fr;align-items:start;gap:18px;padding:18px}.brand-card{align-self:center}.side-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar:before{position:static;margin-bottom:4px}.topbar{display:block;padding-top:0}}
@media(max-width:700px){main{padding:24px 14px 42px}aside{display:flex;flex-direction:column;gap:18px;padding:16px}.brand-card{width:190px}.course-pill,.side-stats{width:100%}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:15px}.stat b{font-size:1.7rem}.filters,.add-form{grid-template-columns:1fr}.search{width:100%}.card{padding:15px;border-radius:15px}.toolbar button{flex:1}.toolbar input[type=date]{flex:1;min-width:130px!important}.row{grid-template-columns:40px minmax(0,1fr) 24px;gap:10px}.status{grid-column:2 / -1;grid-row:2;flex-wrap:wrap}.remove{grid-column:3;grid-row:1}.pill{flex:1;min-width:0}.info{grid-column:2;grid-row:1}.avatar{grid-column:1;grid-row:1}.row{padding:14px 0}}

</style>

<style id="cybersecurity-theme">
:root {
  --cy-bg: #050b14;
  --cy-panel: #0b1624;
  --cy-panel-2: #0e1d2e;
  --cy-line: rgba(0, 240, 190, .20);
  --cy-neon: #00f0b5;
  --cy-blue: #35a7ff;
  --cy-text: #e7f6ff;
  --cy-muted: #8ba7bc;
}
html, body {
  background:
    radial-gradient(ellipse at 80% 0%, rgba(0, 122, 255, .13), transparent 38%),
    radial-gradient(ellipse at 15% 30%, rgba(0, 240, 181, .07), transparent 35%),
    var(--cy-bg) !important;
  color: var(--cy-text) !important;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  pointer-events: none;
  opacity: .18;
  background-image:
    linear-gradient(rgba(0,240,181,.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,240,181,.07) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: linear-gradient(to bottom, black, transparent 85%);
}
body > *, main, .app, .container, .dashboard, .main-content, .content {
  position: relative;
}
aside, .sidebar, nav.sidebar {
  background: linear-gradient(180deg, #071523 0%, #08101c 100%) !important;
  border-right: 1px solid var(--cy-line) !important;
  box-shadow: 8px 0 35px rgba(0,0,0,.18);
}
header, .topbar, .header, .page-header {
  background: rgba(7, 18, 31, .82) !important;
  border-color: var(--cy-line) !important;
  backdrop-filter: blur(14px);
}
h1, h2, h3, .logo, .brand, .page-title {
  color: var(--cy-text) !important;
  letter-spacing: -.025em;
}
h1::after, .page-title::after {
  content: "";
  display: block;
  width: 58px;
  height: 3px;
  margin-top: 9px;
  border-radius: 4px;
  background: linear-gradient(90deg, var(--cy-neon), var(--cy-blue));
  box-shadow: 0 0 14px rgba(0,240,181,.5);
}
p, label, small, .muted, .subtitle, .description {
  color: var(--cy-muted);
}
.card, .stat-card, .panel, .content-card, .table-wrap, .modal-content, .form-card {
  background: linear-gradient(145deg, rgba(13,29,46,.96), rgba(7,18,30,.96)) !important;
  border: 1px solid var(--cy-line) !important;
  border-radius: 14px !important;
  box-shadow: 0 10px 28px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.025) !important;
}
.card:hover, .stat-card:hover {
  border-color: rgba(0,240,181,.45) !important;
  box-shadow: 0 12px 32px rgba(0,0,0,.28), 0 0 18px rgba(0,240,181,.06) !important;
}
button, .btn, input[type="button"], input[type="submit"] {
  border: 1px solid rgba(0,240,181,.38) !important;
  border-radius: 8px !important;
  background: linear-gradient(135deg, #00b98d, #087eaa) !important;
  color: #03111a !important;
  font-weight: 750 !important;
  box-shadow: 0 0 15px rgba(0,240,181,.10);
  transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
}
button:hover, .btn:hover, input[type="button"]:hover, input[type="submit"]:hover {
  transform: translateY(-1px);
  filter: brightness(1.12);
  box-shadow: 0 0 20px rgba(0,240,181,.22);
}
button.secondary, .btn-secondary, button.outline, .btn-outline {
  background: rgba(9, 27, 43, .9) !important;
  color: var(--cy-neon) !important;
}
input, select, textarea {
  background: #06111d !important;
  color: var(--cy-text) !important;
  border: 1px solid rgba(87,143,173,.36) !important;
  border-radius: 8px !important;
}
input:focus, select:focus, textarea:focus {
  outline: none !important;
  border-color: var(--cy-neon) !important;
  box-shadow: 0 0 0 3px rgba(0,240,181,.10) !important;
}
table {
  color: var(--cy-text) !important;
  border-color: var(--cy-line) !important;
}
thead, th {
  background: #0c2030 !important;
  color: var(--cy-neon) !important;
  border-color: var(--cy-line) !important;
  text-transform: uppercase;
  letter-spacing: .07em;
  font-size: .78rem;
}
td, tr {
  border-color: rgba(125,169,194,.13) !important;
}
tbody tr:nth-child(even) {
  background: rgba(15,37,55,.40) !important;
}
tbody tr:hover {
  background: rgba(0,240,181,.055) !important;
}
.badge, .status, .pill, .tag {
  border: 1px solid rgba(0,240,181,.20);
  background: rgba(0,240,181,.08) !important;
  color: var(--cy-neon) !important;
  border-radius: 999px;
}
a {
  color: var(--cy-neon);
}
hr, .divider {
  border-color: var(--cy-line) !important;
}
footer {
  color: #68869b !important;
}
@media (max-width: 760px) {
  body::before { background-size: 24px 24px; }
}
</style>


<style id="attendance-heading-fix">
/* Fix Attendance heading visibility/selection in the cybersecurity theme */
h1, h2, h3, h4,
.page-title, .section-title, .attendance-title,
#attendance, #attendance-title, [data-section="attendance"] {
  color: #f2fbff !important;
  -webkit-text-fill-color: #f2fbff !important;
  user-select: text !important;
  -webkit-user-select: text !important;
  cursor: text;
  position: relative;
  z-index: 2;
}
h1::after, h2::after, h3::after,
.page-title::after, .section-title::after, .attendance-title::after {
  pointer-events: none !important;
}
::selection {
  background: rgba(0, 240, 181, .38) !important;
  color: #ffffff !important;
}
</style>


<style id="attendance-status-visibility-fix">
/* Status selection must override the global cybersecurity button styling */
button.pill.present.on,
button.pill.present.on:hover {
  background: #00c98f !important;
  background-image: none !important;
  border-color: #00f0b5 !important;
  color: #031710 !important;
  box-shadow: 0 0 0 2px rgba(0,240,181,.22), 0 0 18px rgba(0,240,181,.28) !important;
  outline: 2px solid rgba(0,240,181,.35);
  outline-offset: 1px;
}
button.pill.late.on,
button.pill.late.on:hover {
  background: #f0a52b !important;
  background-image: none !important;
  border-color: #ffc45d !important;
  color: #211400 !important;
  box-shadow: 0 0 0 2px rgba(240,165,43,.20) !important;
  outline: 2px solid rgba(240,165,43,.30);
  outline-offset: 1px;
}
button.pill.absent.on,
button.pill.absent.on:hover {
  background: #ff536b !important;
  background-image: none !important;
  border-color: #ff8293 !important;
  color: #25040a !important;
  box-shadow: 0 0 0 2px rgba(255,83,107,.20) !important;
  outline: 2px solid rgba(255,83,107,.30);
  outline-offset: 1px;
}
button.pill:not(.on) {
  background: #091a29 !important;
  background-image: none !important;
  color: #9bb6c9 !important;
  border-color: rgba(87,143,173,.35) !important;
  box-shadow: none !important;
}
button.pill:not(.on):hover {
  color: #e7f6ff !important;
  border-color: #00f0b5 !important;
}
</style>

</head>

<script>
(function () {
  var KEY = "ucs-attendance-pgdip-v3";
  var DEFAULT_STUDENTS = [
    { id: "s1", name: "Student One", roll: "UCS-001" },
    { id: "s2", name: "Student Two", roll: "UCS-002" },
    { id: "s3", name: "Student Three", roll: "UCS-003" },
    { id: "s4", name: "Student Four", roll: "UCS-004" },
    { id: "s5", name: "Student Five", roll: "UCS-005" }
  ];
  var state = load();
  [{ id: "s-prithiyuman", name: "Prithiyuman", roll: "001" }, { id: "s-swedha", name: "Swedha", roll: "002" }].forEach(function (st) {
    var exists = state.students.some(function (s) { return s.roll === st.roll; });
    if (!exists) state.students.push(st);
  });
  var COURSE = "PG Diploma in Cybersecurity";
  (function mergeSpellings() {
    var recs = state.records || {};
    Object.keys(recs).forEach(function (k) {
      var p = k.split("|"), c = p[0], d = p[1];
      if (c === COURSE || !d) return;
      if (c.toLowerCase().replace(/\s+/g, " ").trim() !== COURSE.toLowerCase()) return;
      var target = COURSE + "|" + d;
      recs[target] = Object.assign({}, recs[k], recs[target] || {});
      delete recs[k];
    });
    state.records = recs;
  })();
  var $ = function (id) { return document.getElementById(id); };

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.students)) return parsed;
      }
    } catch (e) {}
    return { students: DEFAULT_STUDENTS.slice(), records: {} };
  }

  function save(showToast) {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
      if (showToast) toast("Attendance saved");
    } catch (e) {
      toast("Could not save in this browser");
    }
  }

  function todayISO() {
    var d = new Date();
    d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  function sessionKey() { return COURSE + "|" + $("date").value; }

  function session() {
    var k = sessionKey();
    if (!state.records[k]) state.records[k] = {};
    return state.records[k];
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function initials(name) {
    return name.split(/\s+/).filter(Boolean).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase() || "?";
  }

  function toast(msg) {
    var t = $("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function render() {
    var rec = session();
    var q = $("search").value.trim().toLowerCase();
    var counts = { present: 0, late: 0, absent: 0 };
    state.students.forEach(function (s) {
      if (counts[rec[s.id]] !== undefined) counts[rec[s.id]]++;
    });

    var visible = state.students.filter(function (s) {
      return !q || s.name.toLowerCase().indexOf(q) !== -1 || (s.roll || "").toLowerCase().indexOf(q) !== -1;
    });

    $("list").innerHTML = visible.length === 0
      ? '<div class="empty">' + (state.students.length ? "No students match your search." : "No students yet. Add one below.") + "</div>"
      : visible.map(function (s) {
          var st = rec[s.id];
          var pills = ["present", "late", "absent"].map(function (x) {
            var label = x.charAt(0).toUpperCase() + x.slice(1);
            return '<button class="pill ' + x + (st === x ? " on" : "") + '" data-id="' + s.id + '" data-status="' + x + '">' + label + "</button>";
          }).join("");
          return '<div class="row">' +
            '<div class="avatar">' + esc(initials(s.name)) + "</div>" +
            '<div class="info"><strong>' + esc(s.name) + "</strong><span>" + esc(s.roll || "No ID") + "</span></div>" +
            '<div class="status">' + pills + "</div>" +
            '<button class="remove" data-remove="' + s.id + '" title="Remove student">&#10005;</button>' +
            "</div>";
        }).join("");

    var total = state.students.length;
    var attended = counts.present + counts.late;
    var rate = total ? Math.round((attended / total) * 100) : 0;
    $("totalN").textContent = total;
    $("presentN").textContent = counts.present;
    $("lateN").textContent = counts.late;
    $("absentN").textContent = counts.absent;
    $("rateBar").style.width = rate + "%";
    $("rateText").textContent = rate + "% attendance";
    $("sTotal").textContent = total;
    $("sPresent").textContent = counts.present;
    $("sLate").textContent = counts.late;
    $("sAbsent").textContent = counts.absent;
    $("sideCourse").textContent = $("course").value.trim() || "Untitled class";
    $("sideDate").textContent = $("date").value;
    var sel = $("histStudent"), prev = sel.value;
    sel.innerHTML = state.students.map(function (s) {
      return '<option value="' + esc(s.id) + '">' + esc(s.name) + (s.roll ? " (" + esc(s.roll) + ")" : "") + "</option>";
    }).join("");
    if (state.students.some(function (s) { return s.id === prev; })) sel.value = prev;
  }

  $("list").addEventListener("click", function (e) {
    var btn = e.target.closest("button");
    if (!btn) return;
    var rec = session();
    if (btn.dataset.status) {
      var id = btn.dataset.id, status = btn.dataset.status;
      if (rec[id] === status) delete rec[id]; else rec[id] = status;
      save(false);
      render();
    } else if (btn.dataset.remove) {
      var sid = btn.dataset.remove;
      var student = state.students.find(function (s) { return s.id === sid; });
      if (!student || !confirm("Remove " + student.name + " from the roster?")) return;
      state.students = state.students.filter(function (s) { return s.id !== sid; });
      Object.keys(state.records).forEach(function (k) { delete state.records[k][sid]; });
      save(false);
      render();
    }
  });

  $("allPresentBtn").addEventListener("click", function () {
    var rec = session();
    state.students.forEach(function (s) { rec[s.id] = "present"; });
    save(false);
    render();
    toast("All students marked present");
  });

  $("clearBtn").addEventListener("click", function () {
    if (!confirm("Clear all marks for this course and date?")) return;
    state.records[sessionKey()] = {};
    save(false);
    render();
    toast("Marks cleared");
  });

  $("saveBtn").addEventListener("click", function () { save(true); });

  $("addForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("newName").value.trim();
    var roll = $("newRoll").value.trim();
    if (!name) return;
    state.students.push({
      id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      name: name, roll: roll
    });
    $("newName").value = "";
    $("newRoll").value = "";
    save(false);
    render();
    toast("Student added");
  });

  $("exportBtn").addEventListener("click", function () {
    var rec = session();
    var course = COURSE;
    var date = $("date").value;
    var rows = [["Name", "Student ID", "Status", "Course", "Date"]];
    state.students.forEach(function (s) {
      rows.push([s.name, s.roll || "", rec[s.id] || "Not marked", course, date]);
    });
    var csv = rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "attendance-" + date + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  $("exportRangeBtn").addEventListener("click", function () {
    var from = $("fromDate").value, to = $("toDate").value;
    if (!from || !to) { toast("Pick a From and To date"); return; }
    if (from > to) { toast("From date must be before To date"); return; }
    var entries = [];
    Object.keys(state.records).forEach(function (k) {
      var parts = k.split("|"), course = parts[0], d = parts[1];
      if (course !== COURSE || !d || d < from || d > to) return;
      var rec = state.records[k];
      if (Object.keys(rec).length === 0) return;
      entries.push({ date: d, course: course, rec: rec });
    });
    entries.sort(function (a, b) {
      return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.course < b.course ? -1 : a.course > b.course ? 1 : 0);
    });
    if (entries.length === 0) { toast("No attendance saved in that range"); return; }
    var rows = [["Date", "Course", "Student ID", "Name", "Status"]];
    entries.forEach(function (e) {
      state.students.forEach(function (s) {
        rows.push([e.date, e.course, s.roll || "", s.name, e.rec[s.id] || "Not marked"]);
      });
    });
    var csv = rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "attendance-" + from + "-to-" + to + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("Downloaded " + entries.length + " session(s)");
  });

  $("histBtn").addEventListener("click", function () {
    var sid = $("histStudent").value;
    var student = state.students.find(function (s) { return s.id === sid; });
    if (!student) { toast("Select a student first"); return; }
    var sessions = [];
    Object.keys(state.records).forEach(function (k) {
      var p = k.split("|"), c = p[0], d = p[1];
      if (c !== COURSE || !d) return;
      if (Object.keys(state.records[k]).length === 0) return;
      sessions.push({ date: d, rec: state.records[k] });
    });
    if (sessions.length === 0) { toast("No attendance saved for this class yet"); return; }
    sessions.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

    var counts = { present: 0, late: 0, absent: 0, notMarked: 0 };
    var rows = [["Date", "Course", "Student ID", "Name", "Status"]];
    sessions.forEach(function (x) {
      var st = x.rec[student.id] || "not marked";
      if (st === "present") counts.present++;
      else if (st === "late") counts.late++;
      else if (st === "absent") counts.absent++;
      else counts.notMarked++;
      rows.push([x.date, COURSE, student.roll || "", student.name, st]);
    });
    var attended = counts.present + counts.late;
    var pct = sessions.length ? Math.round((attended / sessions.length) * 100) : 0;
    rows.push([]);
    rows.push(["Summary"]);
    rows.push(["Total sessions", sessions.length]);
    rows.push(["Present", counts.present]);
    rows.push(["Late", counts.late]);
    rows.push(["Absent", counts.absent]);
    rows.push(["Not marked", counts.notMarked]);
    rows.push(["Attendance %", pct + "%"]);

    var csv = rows.map(function (r) {
      return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(",");
    }).join("\n");
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "history-" + (student.roll || student.name).replace(/\s+/g, "_") + ".csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("History for " + student.name + " downloaded");
  });

  $("search").addEventListener("input", render);
  $("course").addEventListener("input", render);
  $("date").addEventListener("change", render);

  $("date").value = todayISO();
  $("toDate").value = $("date").value;
  var past = new Date();
  past.setDate(past.getDate() - 9);
  past.setMinutes(past.getMinutes() - past.getTimezoneOffset());
  $("fromDate").value = past.toISOString().slice(0, 10);
  render();
})();
</script>
</body>
</html>
